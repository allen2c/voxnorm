# Publishes to PyPI on a version tag (v0.1.0, v0.2.0, ...) via PyPI trusted
# publishing — configure the publisher once on pypi.org (project: voxnorm,
# owner: allen2c, repo: voxnorm, workflow: release.yml, environment: pypi)
# and no API token ever lives in this repo.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Tag matches the package version
        run: |
          version=$(uv run python -c "import voxnorm; print(voxnorm.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != $version"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
